<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
<div class="container text-center">
    <div class="card shadow-sm mx-auto" style="max-width: 520px;">
        <div class="card-body p-5">
            <span class="badge bg-secondary fs-6 mb-3">HTTP 404</span>
            <h1 class="display-4 fw-bold">404</h1>
            <h4 class="mb-3">Page Not Found</h4>
            <p class="text-muted mb-4">The requested URL or record does not exist on this server.</p>
            <div class="d-flex justify-content-center gap-2">
                <a href="/dashboard" class="btn btn-primary">Go to Dashboard</a>
                <a href="/logout" class="btn btn-outline-secondary">Switch Account</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
