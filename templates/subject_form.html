{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>{% if subject %}Edit Subject: {{ subject.subject_code }}{% else %}Add New Subject{% endif %}</h2>

    {% if errors %}
        <div class="alert alert-danger">
            <ul class="mb-0">
            {% for error in errors %}
                <li>{{ error }}</li>
            {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form method="POST" class="mt-4">
        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="subject_code" class="form-label">Subject Code <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="subject_code" name="subject_code" value="{{ form.subject_code }}" placeholder="e.g., IT101" required>
            </div>
            
            <div class="col-md-6 mb-3">
                <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="description" name="description" value="{{ form.description }}" placeholder="e.g., Introduction to Programming" required>
            </div>

            <div class="col-md-2 mb-3">
                <label for="units" class="form-label">Units <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="units" name="units" value="{{ form.units }}" min="1" max="10" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary mt-3">{% if subject %}Save Changes{% else %}Add Subject{% endif %}</button>
        <a href="{{ url_for('subjects') }}" class="btn btn-secondary mt-3 ms-2">Cancel</a>
    </form>
</div>
{% endblock %}
