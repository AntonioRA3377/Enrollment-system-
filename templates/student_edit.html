{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Student: {{ student.student_number }}</h2>

    {% if errors %}
        <div class="alert alert-danger">
            <ul class="mb-0">
            {% for error in errors %}
                <li>{{ error }}</li>
            {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form method="POST" action="{{ url_for('student_edit', student_id=student.student_id) }}" class="mt-4">
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="year_level" class="form-label">Year Level <span class="text-danger">*</span></label>
                <select class="form-control" id="year_level" name="year_level" required>
                    <option value="1" {% if form.year_level == '1' %}selected{% endif %}>1st Year</option>
                    <option value="2" {% if form.year_level == '2' %}selected{% endif %}>2nd Year</option>
                    <option value="3" {% if form.year_level == '3' %}selected{% endif %}>3rd Year</option>
                    <option value="4" {% if form.year_level == '4' %}selected{% endif %}>4th Year</option>
                    <option value="5" {% if form.year_level == '5' %}selected{% endif %}>5th Year</option>
                </select>
            </div>

            <!-- NEW LAB 6 PROGRAM DROPDOWN -->
            <div class="col-md-6 mb-3">
                <label for="program_id" class="form-label">Degree Program</label>
                <select name="program_id" id="program_id" class="form-control">
                    <option value="">-- Select a Program --</option>
                    {% for program in programs %}
                        <option value="{{ program.program_id }}" {% if form.program_id == program.program_id|string %}selected{% endif %}>
                            {{ program.program_code }} - {{ program.program_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="first_name" class="form-label">First Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="first_name" name="first_name" value="{{ form.first_name }}" required>
            </div>
            <div class="col-md-4 mb-3">
                <label for="middle_name" class="form-label">Middle Name</label>
                <input type="text" class="form-control" id="middle_name" name="middle_name" value="{{ form.middle_name }}">
            </div>
            <div class="col-md-4 mb-3">
                <label for="last_name" class="form-label">Last Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="last_name" name="last_name" value="{{ form.last_name }}" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="birthdate" class="form-label">Birthdate</label>
                <input type="date" class="form-control" id="birthdate" name="birthdate" value="{{ form.birthdate }}">
            </div>
            <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="email" name="email" value="{{ form.email }}" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="contact_number" class="form-label">Contact Number</label>
                <input type="text" class="form-control" id="contact_number" name="contact_number" value="{{ form.contact_number }}">
            </div>
            <div class="col-md-6 mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" class="form-control" id="address" name="address" value="{{ form.address }}">
            </div>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Save Changes</button>
        <a href="{{ url_for('student_profile', student_id=student.student_id) }}" class="btn btn-secondary mt-3 ms-2">Cancel</a>
    </form>
</div>
{% endblock %}
