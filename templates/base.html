<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Enrollment System{% endblock %}</title>
  <style>
    :root {
      --ink: #1f2933;
      --muted: #52606d;
      --line: #d5dae1;
      --page: #f7f8fa;
      --accent: #1d4ed8;
      --success: #15803d;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
      color: var(--ink);
      background: var(--page);
      margin: 0;
      display: flex;
      min-height: 100vh;
    }
    
    .sidebar {
      width: 250px;
      background: #ffffff;
      border-right: 1px solid var(--line);
      padding: 24px 16px;
      flex-shrink: 0;
    }
    .sidebar h2 { margin-top: 0; font-size: 1.25rem; margin-bottom: 24px; color: var(--ink); }
    .sidebar nav { display: flex; flex-direction: column; gap: 8px; }
    .sidebar nav a {
      display: block;
      padding: 10px 12px;
      color: var(--muted);
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s;
    }
    .sidebar nav a:hover { background: #eef1f5; color: var(--accent); }
    
    .content-wrapper {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    @media (max-width: 768px) { 
      body { flex-direction: column; } 
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--line); }
    }

    h1, h2, h3 { color: var(--ink); margin-top: 0; }
    a { color: var(--accent); }

    label, .form-label { display: block; margin-top: 14px; font-weight: bold; }
    input, textarea, select, .form-control, .form-select {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      font: inherit;
      border: 1px solid #9aa5b1;
      border-radius: 4px;
      background: #ffffff;
    }

    button, .button, .btn {
      display: inline-block;
      padding: 10px 18px;
      font: inherit;
      font-weight: bold;
      color: #ffffff;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-success { background: var(--success); border-color: var(--success); color: white; }
    .btn-secondary { color: var(--ink); background: #ffffff; border: 1px solid var(--line); }
    .btn-danger { background: var(--danger); border-color: var(--danger); color: white; }

    .message, .alert { padding: 12px; border-radius: 4px; margin-bottom: 16px; }
    .error, .danger, .alert-danger { color: #8a1020; background: #fde8ea; border: 1px solid #f87171; }
    .success, .alert-success { color: #14532d; background: #dcfce7; border: 1px solid #4ade80; }

    .table-wrap { overflow-x: auto; }
    table, .table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--line); }
    th { background: #eef1f5; }

    .mt-3 { margin-top: 1rem; }
    .mt-4 { margin-top: 1.5rem; }
    .mb-3 { margin-bottom: 1rem; }
    .d-flex { display: flex; }
    .justify-content-between { justify-content: space-between; }
    .align-items-center { align-items: center; }
    .card { border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin-top: 16px; }
  </style>
</head>
<body>
  
  <div class="sidebar">
    <h2>Admin Dashboard</h2>
    <nav aria-label="Main">
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('students') }}">Students</a>
      <a href="{{ url_for('student_new') }}">Register Student</a>
      <a href="{{ url_for('courses') }}">Courses</a>
      <a href="{{ url_for('offerings') }}">Course Offerings</a>
    </nav>
  </div>

  <div class="content-wrapper">
    <main>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="message {{ category }}" role="alert">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>

</body>
</html>
