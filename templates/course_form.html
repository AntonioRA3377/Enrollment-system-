{% extends "base.html" %}

{% block title %}{{ 'Edit Course' if course else 'Add Course' }}{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <h2>{{ 'Edit Course' if course else 'Add New Course' }}</h2>
    <hr>
    
    <form method="POST">
        <div>
            <label for="course_code">Course Code</label>
            <input 
                type="text" 
                id="course_code" 
                name="course_code" 
                value="{{ course.course_code if course else '' }}" 
                placeholder="e.g. IT301" 
                required
            >
        </div>

        <div>
            <label for="course_title">Course Title</label>
            <input 
                type="text" 
                id="course_title" 
                name="course_title" 
                value="{{ course.course_title if course else '' }}" 
                placeholder="e.g. Web Systems and Technologies" 
                required
            >
        </div>

        <div>
            <label for="units">Units</label>
            <input 
                type="number" 
                id="units" 
                name="units" 
                value="{{ course.units if course else 3 }}" 
                min="1" 
                max="6" 
                required
            >
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4">
            <a href="{{ url_for('courses') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-success">
                {{ 'Update Course' if course else 'Save Course' }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
