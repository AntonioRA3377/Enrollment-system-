{% extends 'base.html' %}

{% block title %}{{ 'Edit Student' if student else 'Register Student' }}{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <h2>{{ 'Edit Student' if student else 'Register New Student' }}</h2>
    <hr>
    <form method="POST">
        {% if not student %}
        <div>
            <label for="student_number">Student Number</label>
            <input type="text" id="student_number" name="student_number" required placeholder="e.g. 2026-0001">
        </div>
        {% endif %}

        <div>
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" value="{{ student.first_name if student else '' }}" required>
        </div>

        <div>
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name" value="{{ student.last_name if student else '' }}" required>
        </div>

        <div>
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" value="{{ student.email if student else '' }}" required>
        </div>

        <div>
            <label for="program_id">Academic Program</label>
            <select id="program_id" name="program_id" required>
                <option value="">-- Select Program --</option>
                {% for p in programs %}
                <option value="{{ p.program_id }}" {% if student and student.program_id == p.program_id %}selected{% endif %}>
                    {{ p.program_code }} - {{ p.program_name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4">
            <a href="{{ url_for('students') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-success">{{ 'Update Student' if student else 'Save Student' }}</button>
        </div>
    </form>
</div>
{% endblock %}
