{% extends "base.html" %}

{% block title %}Register New Student - Lab 16{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <h3 class="mb-4">Register New Student</h3>
    
    <form method="POST" action="{{ url_for('student_new') }}" enctype="multipart/form-data">
        <div class="mb-3" style="margin-bottom: 15px;">
            <label class="form-label">Student Number</label>
            <input type="text" name="student_number" class="form-control" placeholder="e.g. 2026-0001" required style="width: 100%; padding: 8px;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;" class="mb-3">
            <div>
                <label class="form-label">First Name</label>
                <input type="text" name="first_name" class="form-control" required style="width: 100%; padding: 8px;">
            </div>
            <div>
                <label class="form-label">Last Name</label>
                <input type="text" name="last_name" class="form-control" required style="width: 100%; padding: 8px;">
            </div>
        </div>

        <div class="mb-3" style="margin-bottom: 15px;">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" required style="width: 100%; padding: 8px;">
        </div>

        <div class="mb-3" style="margin-bottom: 15px;">
            <label class="form-label">Academic Program</label>
            <select name="program_id" class="form-select" style="width: 100%; padding: 8px;">
                <option value="">-- Select Program --</option>
                {% for p in programs %}
                <option value="{{ p.program_id }}">{{ p.program_code }} - {{ p.program_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-4" style="margin-bottom: 20px;">
            <label class="form-label">Profile Image (Optional)</label>
            <input type="file" name="profile_image" class="form-control" accept="image/*" style="width: 100%; padding: 6px;">
        </div>

        <div style="display: flex; justify-content: space-between;">
            <a href="{{ url_for('students') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-success">Save Student</button>
        </div>
    </form>
</div>
{% endblock %}
