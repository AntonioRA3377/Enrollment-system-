<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>403 - Access Denied</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<!-- System-Wide UI & Dark Mode -->
<meta name="app-session" data-role="{{ session.get('role', '') }}" data-student-id="{{ session.get('student_id', '') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}?v=7">
<script>
    (function() {
        var t = localStorage.getItem('enrollment_system_theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var m = localStorage.getItem('enrollment_nav_mode') || 'dock';
        document.documentElement.setAttribute('data-bs-theme', t);
        document.documentElement.setAttribute('data-nav-mode', m);
    })();
</script>
<!-- /System-Wide UI & Dark Mode -->
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
<div class="container text-center">
    <div class="card shadow-sm mx-auto" style="max-width: 520px;">
        <div class="card-body p-5">
            <span class="badge bg-warning fs-6 mb-3">HTTP 403</span>
            <h1 class="display-4 fw-bold">403</h1>
            <h4 class="mb-3">Access Denied</h4>
            <p class="text-muted mb-4">You do not have permission to access this resource with your current role.</p>
            <div class="d-flex justify-content-center gap-2">
                <a href="/dashboard" class="btn btn-primary">Go to Dashboard</a>
                <a href="/logout" class="btn btn-outline-secondary">Switch Account</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<!-- System-Wide Theme JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/theme.js') }}?v=7"></script>
<!-- /System-Wide Theme JS -->
</body>
</html>
