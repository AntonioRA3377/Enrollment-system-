{% extends 'base.html' %}

{% block content %}
<h2>Add New Course Offering</h2>

<form method="POST" class="mt-3">
    <div class="mb-3">
        <label class="form-label">Select Course *</label>
        <select name="course_id" class="form-select" required>
            <option value="">-- Choose Course --</option>
            {% for c in courses %}
            <option value="{{ c.course_id }}">{{ c.course_code }} - {{ c.course_title }}</option>
            {% endfor %}
        </select>
    </div>
    
    <div class="mb-3">
        <label class="form-label">Section Name *</label>
        <input type="text" name="section_name" class="form-control" placeholder="e.g. BSIT-3A" required>
    </div>
    
    <div class="mb-3">
        <label class="form-label">Schedule *</label>
        <input type="text" name="schedule" class="form-control" placeholder="e.g. MWF 9:00 AM - 10:30 AM" required>
    </div>
    
    <div class="mb-3">
        <label class="form-label">Room *</label>
        <input type="text" name="room" class="form-control" placeholder="e.g. Lab 2" required>
    </div>
    
    <div class="mb-3">
        <label class="form-label">Capacity *</label>
        <input type="number" name="capacity" class="form-control" value="40" required>
    </div>

    <button type="submit" class="btn btn-primary">Save Offering</button>
    <a href="{{ url_for('offerings') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
